<!DOCTYPE html>
<html>
<head>
  <title>Dunah Cloud Studio</title>
  
  <!-- Core CodeMirror Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
  
  <!-- Core CodeMirror Engine Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
  
  <!-- Dependent Syntax Highlight Modes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>

  <style>
    body {
      background-color:#1a1a1a;
      font-family:sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      color: white;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .studio-container {
      display: flex;
      gap: 20px;
      flex: 1;
    }
    .CodeMirror {
      width: 100%;
      height: 100% !important;
      border: 1px solid #444;
    }
    .editor-pane, .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    #preview {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border: 1px solid #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Dunah Cloud Studio</h1>
  
  <div class="studio-container">
    <div class="editor-pane">
      <textarea id="editor"><!-- Real-time Preview Demo -->
<style>
  h2 { color: #ff79c6; font-family: sans-serif; }
  p { color: #50fa7b; font-weight: bold; background: #282a36; padding: 10px; display: inline-block; }
</style>

<h2>Live Preview Working Successfully!</h2>
<p>Syntax highlighting is active.</p></textarea>
    </div>

    <div class="preview-pane">
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script>
    var editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      lineNumbers: true,
      mode: 'htmlmixed',
      theme: 'dracula', 
      lineWrapping: true,
      matchBrackets: true,
    });

    function updatePreview() {
      var previewFrame = document.getElementById('preview');
      var previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      
      previewDoc.open();
      previewDoc.write(editor.getValue());
      previewDoc.close();
    }

    updatePreview();

    editor.on('change', function() {
      updatePreview();
    });
  </script>
</body>
</html>
